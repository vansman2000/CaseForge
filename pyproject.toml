[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caseforge"
version = "0.1.0a1"
description = "Linux-first evidence management and litigation binder generator."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8"
]

[project.scripts]
caseforge = "caseforge.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]